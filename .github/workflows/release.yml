name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # A manual run builds the APK too and keeps it as a workflow artifact, to test signing without a release.
  apk:
    needs: release-please
    if: needs.release-please.outputs.created == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: jdx/mise-action@v5
      - run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0" "platforms;android-37.0"
          base64 -d <<< "$KEYSTORE" > "$RUNNER_TEMP/release.jks"
          SIGNING_KEYSTORE="$RUNNER_TEMP/release.jks" mise run build
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      - if: needs.release-please.outputs.created == 'true'
        run: |
          cp app/build/outputs/apk/release/dooplex.apk "dooplex-$TAG.apk"
          gh release upload "$TAG" "dooplex-$TAG.apk"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: needs.release-please.outputs.created != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dooplex
          path: app/build/outputs/apk/release/dooplex.apk
