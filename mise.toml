[tasks.build]
description = "Build an optimized APK signed with the existing Android development key; crash reports and analytics stay off unless DOOPLEX_CRASH_URL / DOOPLEX_ANALYTICS_URL are set"
shell = "bash -c"
run = '''
set -euo pipefail
printf 'Crash reports: %s\nAnalytics: %s\n' "${DOOPLEX_CRASH_URL:-off}" "${DOOPLEX_ANALYTICS_URL:-off}"
./gradlew :app:assembleRelease :app:validateSigningDebug
sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
signer="${APKSIGNER:-$sdk/build-tools/36.0.0/apksigner}"
key="${ANDROID_USER_HOME:-$HOME/.android}/debug.keystore"
apk="app/build/outputs/apk/release/dooplex-movies.apk"
"$signer" sign --ks "$key" --ks-key-alias androiddebugkey \
  --ks-pass pass:android --key-pass pass:android \
  --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
"$signer" verify "$apk"
python3 tools/check-dex-access.py "$apk" "$sdk/build-tools/36.0.0/dexdump"
printf 'Built %s\n' "$apk"
'''

[tasks.upload]
description = "Build a development APK that reports crashes and analytics to this PC and submit it to the Zidoo web installer; override the address with ZIDOO_URL"
shell = "bash -c"
run = '''
set -euo pipefail
target="${ZIDOO_URL:-http://<zidoo-ip>:18888}"
host="${target#*://}"
host="${host%%[:/]*}"
pc=$(ip -4 route get "$host" 2>/dev/null | sed -nE 's/.* src ([0-9.]+).*/\1/p')
# Only these development installs report to `mise run receiver` on this PC; set either variable empty to turn it off.
DOOPLEX_CRASH_URL="${DOOPLEX_CRASH_URL-${pc:+http://$pc:8797/crash}}" \
  DOOPLEX_ANALYTICS_URL="${DOOPLEX_ANALYTICS_URL-${pc:+http://$pc:8797/events}}" mise run build
response=$(mktemp)
trap 'rm -f "$response"' EXIT
# Web Install installs the APK and then fails in its own multipart parser, so browsers get this 400 too.
status=$(curl --silent --show-error \
  --connect-timeout 10 --max-time 180 \
  --header 'Expect:' \
  --header 'X-Requested-With: XMLHttpRequest' \
  --form 'file=@app/build/outputs/apk/release/dooplex-movies.apk;type=application/vnd.android.package-archive' \
  --output "$response" --write-out '%{http_code}' \
  "${target%/}/?fallback=1")
if [[ "$status" != 200 ]] && ! grep -q 'next chunk does not start with boundary' "$response"; then
  cat "$response"
  printf '\nUpload rejected (HTTP %s).\n' "$status" >&2
  exit 1
fi
printf 'APK delivered to the Zidoo; it installs in the background.\n'
'''

[tasks.receiver]
description = "Receive crash reports and analytics from development builds on port 8797"
run = "python3 tools/dev-receiver.py"

[tasks.trace]
description = "Ask the running development build for a CPU trace (TRACE_SECONDS, default 10) via `mise run receiver`"
shell = "bash -c"
run = '''
mkdir -p analytics
echo "${TRACE_SECONDS:-10}" > analytics/trace-request
printf 'Requested a %s s trace; it starts with the next analytics upload (within 4 s).\n' "${TRACE_SECONDS:-10}"
'''
