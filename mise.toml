[tasks.build]
description = "Build an optimized APK signed with the existing Android development key; crash reports stay off unless DOOPLEX_CRASH_URL is set"
shell = "bash -c"
run = '''
set -euo pipefail
printf 'Crash reports: %s\n' "${DOOPLEX_CRASH_URL:-off}"
./gradlew :app:assembleRelease :app:validateSigningDebug
sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
signer="${APKSIGNER:-$sdk/build-tools/36.0.0/apksigner}"
key="${ANDROID_USER_HOME:-$HOME/.android}/debug.keystore"
apk="app/build/outputs/apk/release/dooplex-movies.apk"
"$signer" sign --ks "$key" --ks-key-alias androiddebugkey \
  --ks-pass pass:android --key-pass pass:android \
  --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
"$signer" verify "$apk"
printf 'Built %s\n' "$apk"
'''

[tasks.upload]
description = "Build a development APK that reports crashes to this PC and submit it to the Zidoo web installer; override the address with ZIDOO_URL"
shell = "bash -c"
run = '''
set -euo pipefail
target="${ZIDOO_URL:-http://<zidoo-ip>:18888}"
host="${target#*://}"
host="${host%%[:/]*}"
pc=$(ip -4 route get "$host" 2>/dev/null | sed -nE 's/.* src ([0-9.]+).*/\1/p')
# Only these development installs send crashes, to `mise run crashes` on this PC; DOOPLEX_CRASH_URL= turns them off.
DOOPLEX_CRASH_URL="${DOOPLEX_CRASH_URL-${pc:+http://$pc:8797/crash}}" mise run build
response=$(mktemp)
trap 'rm -f "$response"' EXIT
# Web Install installs the APK and then fails in its own multipart parser, so browsers get this 400 too.
status=$(curl --silent --show-error \
  --connect-timeout 10 --max-time 180 \
  --header 'Expect:' \
  --header 'X-Requested-With: XMLHttpRequest' \
  --form 'file=@app/build/outputs/apk/release/dooplex-movies.apk;type=application/vnd.android.package-archive' \
  --output "$response" --write-out '%{http_code}' \
  "${target%/}/?fallback=1")
if [[ "$status" != 200 ]] && ! grep -q 'next chunk does not start with boundary' "$response"; then
  cat "$response"
  printf '\nUpload rejected (HTTP %s).\n' "$status" >&2
  exit 1
fi
printf 'APK delivered to the Zidoo; it installs in the background.\n'
'''

[tasks.crashes]
description = "Receive crash reports from development builds on port 8797"
run = "python3 tools/crash-receiver.py"
